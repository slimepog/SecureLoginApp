<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Chatbot</h2>
        <p>Logged in as: {{ username }}</p>

        <!-- Back to Welcome -->
        <form action="https://127.0.0.1:5000/welcome_page" method="GET" style="margin-bottom: 10px;">
            <button type="submit" class="secondary-btn">Back to Welcome</button>
        </form>

        <!-- Chatbox -->
        <div id="chatLog" style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; border-radius:8px; margin-bottom:10px;"></div>

        <form id="chatForm">
            <input type="text" name="message" placeholder="Say something..." required>
            <button type="submit">Send</button>
        </form>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, msg in messages %}
                        <div class="flash flash-{{ category }}">{{ msg }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>

    <script>
        const form = document.getElementById('chatForm');
        const chatLog = document.getElementById('chatLog');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const userMessage = formData.get('message');

            // Append user's message
            chatLog.innerHTML += `<p><strong>You:</strong> ${userMessage}</p>`;

            // Send to Flask
            const response = await fetch('https://127.0.0.1:5000/chat', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            chatLog.innerHTML += `<p><strong>Bot:</strong> ${data.response}</p>`;
            chatLog.scrollTop = chatLog.scrollHeight;
            form.reset();
        });
    </script>
</body>
</html>
